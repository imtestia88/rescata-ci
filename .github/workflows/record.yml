name: emulator-record

# Minimal public CI harness. It contains NO application source code.
# Flow:
#   1. Clone the private app repo at runtime (secret CI_APP_TOKEN).
#   2. Build the debug APK on the ephemeral runner.
#   3. Boot an API 34 emulator (KVM on GitHub runners), install, drive the
#      UI and record the screen.
#   4. Upload ONLY the screen recording as artifact (no APK, no source).

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Fetch app source (private repo, ephemeral)
        env:
          CI_APP_TOKEN: ${{ secrets.CI_APP_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${CI_APP_TOKEN}@github.com/imtestia88/rescata-app.git" \
            app-src
          ls app-src

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK (quiet)
        run: gradle -q -p app-src assembleDebug --no-daemon

      - name: Record real device run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: '3072M'
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Single entry point: all interactions (incl. loops) live in
          # ci/interact.sh - the runner executes the YAML script line by line.
          script: |
            bash ci/interact.sh

      - name: Upload recording artifact (video only)
        uses: actions/upload-artifact@v4
        with:
          name: rescata-recording
          path: |
            rescata-run.mp4
            viewer-open.png
          if-no-files-found: error
